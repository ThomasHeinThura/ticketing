{{- if .Values.migrateJob.enabled -}}
# Issue #296, S1 (independent Opus 5.5 review of PR #308, BLOCKING): the owner/migration
# credential (TASKDESK_MIGRATION_DATABASE_URL) must never reach the long-running API
# Deployment's environment. This Job is the ONLY object in this chart that ever carries
# it — a pre-install/pre-upgrade hook that runs `apps/api/src/index.ts`'s
# `runMigrationStep()` (migrations, then the database role/grant bootstrap) and exits.
# `templates/deployment.yaml` depends on it implicitly: Helm blocks `install`/`upgrade`
# until every pre-install/pre-upgrade hook Job succeeds, so a failed migration or a
# failed role/grant step (e.g. an external database's owner role lacking CREATEROLE)
# fails the release with the Job's own logs available via `kubectl logs job/
# {{ include "taskdesk.fullname" . }}-migrate`, rather than deploying a Deployment that
# would then fail its own `assertApplicationRoleIsNotPrivileged` check at every boot.
#
# Reconciles docs/05-operations/kubernetes.md's `Job taskdesk-migrate`, previously
# documented as an "optional pre-upgrade hook" alongside migrations running inline in
# the entrypoint by default — S1 makes the separate Job the ONLY mechanism, not an
# optional alternative, because the whole point is that the API process must never see
# the owner credential at all.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "taskdesk.fullname" . }}-migrate
  labels:
    {{- include "taskdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    # Delete a stale Job of the same name before creating this run's (a Job's spec is
    # immutable, so a second `helm upgrade` would otherwise fail to even create it).
    # Never delete on FAILURE: a failed migration's pod and logs are exactly what an
    # operator needs to see via `kubectl logs`/`kubectl describe job` to fix it before
    # retrying — deleting it on failure would remove the "clear message" this whole
    # mechanism exists to provide.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrateJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "taskdesk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "taskdesk.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: Never
      containers:
        - name: migrate
          securityContext:
            {{- toYaml .Values.taskdesk.securityContext | nindent 12 }}
          image: "{{ .Values.taskdesk.image.repository }}:{{ .Values.taskdesk.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.taskdesk.image.pullPolicy }}
          env:
            - name: TASKDESK_ROLE
              value: migrate
            - name: NODE_ENV
              value: {{ .Values.taskdesk.env.nodeEnv | default "production" | quote }}
            - name: TASKDESK_AGENT_URL
              value: "{{ .Values.taskdesk.env.clientUrl }}"
            - name: TASKDESK_PORTAL_URL
              value: "{{ .Values.taskdesk.env.portalUrl }}"
            - name: TASKDESK_ENCRYPTION_KEY
              {{- if .Values.taskdesk.env.encryptionKeyExistingSecret.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.taskdesk.env.encryptionKeyExistingSecret.name }}
                  key: {{ .Values.taskdesk.env.encryptionKeyExistingSecret.key }}
              {{- else }}
              value: {{ .Values.taskdesk.env.encryptionKey | quote }}
              {{- end }}
            - name: TASKDESK_AUTH_SECRET
              {{- if .Values.taskdesk.env.existingSecret.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.taskdesk.env.existingSecret.name }}
                  key: {{ .Values.taskdesk.env.existingSecret.key }}
              {{- else }}
              value: {{ .Values.taskdesk.env.authSecret | quote }}
              {{- end }}
            # deploy/entrypoint.sh requires TASKDESK_DATABASE_URL unconditionally,
            # regardless of TASKDESK_ROLE; runMigrationStep() itself never connects
            # with it, only with TASKDESK_MIGRATION_DATABASE_URL below.
            {{- include "taskdesk.applicationDatabaseUrlEnv" . | nindent 12 }}
            {{- include "taskdesk.migrationDatabaseUrlEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrateJob.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
