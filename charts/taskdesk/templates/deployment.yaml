{{- $corsOrigins := .Values.taskdesk.env.corsOrigins -}}
{{- $corsOriginsValue := "" -}}
{{- if kindIs "slice" $corsOrigins -}}
  {{- $corsOriginsValue = join "," $corsOrigins -}}
{{- else if $corsOrigins -}}
  {{- $corsOriginsValue = $corsOrigins -}}
{{- else if .Values.taskdesk.env.clientUrl -}}
  {{- $corsOriginsValue = .Values.taskdesk.env.clientUrl -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskdesk.fullname" . }}
  labels:
    {{- include "taskdesk.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "taskdesk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "taskdesk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: taskdesk
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "taskdesk.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      enableServiceLinks: {{ default false .Values.enableServiceLinks }}
      containers:
        - name: taskdesk
          securityContext:
            {{- toYaml .Values.taskdesk.securityContext | nindent 12 }}
          image: "{{ .Values.taskdesk.image.repository }}:{{ .Values.taskdesk.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.taskdesk.image.pullPolicy }}
          ports:
            - name: taskdesk
              containerPort: {{ .Values.taskdesk.service.targetPort }}
              protocol: TCP
          env:
            # NODE_ENV is set explicitly and is not allowed to be absent.
            # Several inherited checks compared against the literal string
            # "production"; unset therefore meant "not production" and opened
            # them — credentialed CORS reflecting any origin, among others
            # (decision log, 2026-09-06). The image sets it too; this makes the
            # chart's intent readable in `kubectl describe pod`.
            - name: NODE_ENV
              value: {{ .Values.taskdesk.env.nodeEnv | default "production" | quote }}
            - name: TASKDESK_PORT
              value: {{ .Values.taskdesk.service.targetPort | quote }}
            - name: TASKDESK_AGENT_URL
              value: "{{ .Values.taskdesk.env.clientUrl }}"
            - name: TASKDESK_PORTAL_URL
              value: "{{ .Values.taskdesk.env.portalUrl }}"
            {{- with .Values.taskdesk.env.trustProxy }}
            # Measured, never guessed: docs/05-operations/proxy-topology-evidence.md
            - name: TASKDESK_TRUST_PROXY
              value: {{ . | quote }}
            {{- end }}
            - name: CORS_ORIGINS
              value: {{ $corsOriginsValue | quote }}
            - name: TASKDESK_ENCRYPTION_KEY
              {{- if .Values.taskdesk.env.encryptionKeyExistingSecret.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.taskdesk.env.encryptionKeyExistingSecret.name }}
                  key: {{ .Values.taskdesk.env.encryptionKeyExistingSecret.key }}
              {{- else }}
              value: {{ .Values.taskdesk.env.encryptionKey | quote }}
              {{- end }}
            - name: TASKDESK_AUTH_SECRET
              {{- if .Values.taskdesk.env.existingSecret.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.taskdesk.env.existingSecret.name }}
                  key: {{ .Values.taskdesk.env.existingSecret.key }}
              {{- else }}
              value: {{ .Values.taskdesk.env.authSecret | quote }}
              {{- end }}
            {{- if and (not .Values.taskdesk.env.database.external.enabled) .Values.taskdesk.env.database.appExistingSecret.enabled }}
            - name: TASKDESK_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.taskdesk.env.database.appExistingSecret.name }}
                  key: {{ .Values.taskdesk.env.database.appExistingSecret.key }}
            {{- end }}
            # TASKDESK_DATABASE_URL: the APPLICATION role (issue #296) — never a
            # Postgres superuser, never owns a table. See values.yaml's
            # taskdesk.env.database comments for the split's rationale.
            #
            # TASKDESK_MIGRATION_DATABASE_URL — the owner/superuser credential — is
            # DELIBERATELY ABSENT from this Deployment (S1, independent Opus 5.5
            # review of PR #308, BLOCKING): a long-running pod carrying that
            # credential in its own environment for its whole life is reachable by
            # any process-level compromise regardless of what the code does with
            # it. `templates/migrate-job.yaml` is the only place it is ever set —
            # a one-shot pre-install/pre-upgrade hook Job whose pod exits (and,
            # per its TTL, is cleaned up) right after migrations and the role/
            # grant bootstrap finish. The API's own `runApiBootTasks()` refuses to
            # start if it ever finds this variable in its own environment anyway
            # — a structural backstop, not just a chart convention.
            {{- include "taskdesk.applicationDatabaseUrlEnv" . | nindent 12 }}
            - name: DISABLE_REGISTRATION
              value: {{ .Values.taskdesk.env.disableRegistration | quote }}
            - name: DISABLE_PASSWORD_REGISTRATION
              value: {{ .Values.taskdesk.env.disablePasswordRegistration | quote }}
            - name: DISABLE_EMAIL_OTP_SIGN_IN
              value: {{ .Values.taskdesk.env.disableEmailOtpSignIn | quote }}
            {{- with .Values.taskdesk.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.taskdesk.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.taskdesk.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.taskdesk.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.taskdesk.resources | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
