# Global values
nameOverride: ""
fullnameOverride: ""
replicaCount: 1
# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
# Pod configuration
podAnnotations: {}
podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
imagePullSecrets: []
enableServiceLinks: false
# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""
# PostgreSQL database configuration
postgresql:
  # Set to true to deploy PostgreSQL as part of this chart
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  # Database configuration
  auth:
    database: taskdesk
    username: taskdesk_user
    password: taskdesk_password
    # Use existing secret for database credentials (optional)
    existingSecret: ""
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  # Persistence for PostgreSQL data
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # PostgreSQL service configuration
  service:
    type: ClusterIP
    port: 5432
  # Resources for PostgreSQL
  resources: {}
  # resources:
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
# TaskDesk application configuration (combined API + web frontend)
taskdesk:
  image:
    repository: ghcr.io/usetaskdesk/taskdesk
    # Defaults to Chart.appVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent
  securityContext: {}
  service:
    type: ClusterIP
    port: 5173
    targetPort: 5173
  # Resources are optional and disabled by default
  resources: {}
  # resources:
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi

  env:
    # --------------------------------------------------------------------
    # The five required bootstrap variables.
    # docs/05-operations/configuration-reference.md is the authority; nothing
    # here may introduce a name that is not in it.
    #
    # THERE IS NO DEFAULT FOR ANY SECRET, AND THERE MUST NOT BE. The chart
    # refuses to render when one is missing (templates/validations.yaml) and
    # says which value to set. That is deliberate: an install that starts with
    # a placeholder secret is worse than one that will not start, and an
    # absent TASKDESK_AUTH_SECRET once fell through to a constant published in
    # better-auth's own source, signing every session cookie with a value
    # anyone can read (decision log, 2026-09-06).
    #
    # Why not generate one on install? Because Helm has no memory: a
    # `randAlphaNum` default is a NEW secret on every `helm upgrade` unless it
    # is guarded by a `lookup`, and `lookup` returns nothing under
    # `helm template`, `--dry-run` and most GitOps renderers. Rotating
    # TASKDESK_AUTH_SECRET signs every user out; rotating
    # TASKDESK_ENCRYPTION_KEY makes every stored plugin secret unreadable. A
    # required value that fails loudly is the safer contract, and
    # `existingSecret` is the recommended production form of it.
    # --------------------------------------------------------------------

    # Public agent origin -> TASKDESK_AGENT_URL (e.g. https://ticket.example.com)
    clientUrl: ""
    # Public portal origin -> TASKDESK_PORTAL_URL (e.g. https://portal.example.com)
    # A separate hostname, and therefore a separate cookie scope, is not
    # optional: it is what keeps portal sessions out of the agent application
    # (ADR 0004).
    portalUrl: ""
    # Allowed CORS origins. Accepts a comma-separated string or YAML list.
    # Defaults to clientUrl when left empty.
    corsOrigins: []
    # Session signing -> TASKDESK_AUTH_SECRET. 64 hex characters.
    # Generate with: openssl rand -hex 32
    # Required unless existingSecret.enabled.
    authSecret: ""
    existingSecret:
      enabled: false
      name: ""
      key: auth-secret
    # Plugin-secret encryption -> TASKDESK_ENCRYPTION_KEY. 64 hex characters.
    # Generate with: openssl rand -hex 32
    # LOSE THIS AND EVERY CONFIGURED INTEGRATION MUST BE RECONFIGURED.
    # Required unless encryptionKeyExistingSecret.enabled.
    encryptionKey: ""
    encryptionKeyExistingSecret:
      enabled: false
      name: ""
      key: encryption-key
    # production | development. In development only, HTTP webhook targets are
    # permitted (WH-12). Leave it alone: several inherited security checks
    # compared against the literal string "production", so an unset NODE_ENV
    # meant "not production" and opened them.
    nodeEnv: production
    # Number of trusted reverse-proxy hops, NOT a boolean. Left empty on
    # purpose: it depends on what sits in front of the Ingress, and an
    # unmeasured guess on a security boundary is worse than an explicit gap.
    # Measure it, then set it: docs/05-operations/proxy-topology-evidence.md
    trustProxy: ""
    disableRegistration: false
    disablePasswordRegistration: false
    disableEmailOtpSignIn: false
    # Database configuration
    database:
      # Use external PostgreSQL (set postgresql.enabled to false)
      # Important: when using external postgres, make sure you have set up the db user correctly:
      #   CREATE DATABASE taskdesk;
      #   CREATE USER taskdesk_user WITH PASSWORD 'your_password';
      #   GRANT ALL PRIVILEGES ON DATABASE taskdesk TO taskdesk_user;
      #   \c taskdesk;
      #   GRANT USAGE ON SCHEMA public TO taskdesk_user;
      #   GRANT CREATE ON SCHEMA public TO taskdesk_user;
      #   ALTER SCHEMA public OWNER TO taskdesk_user;
      external:
        enabled: false
        host: ""
        port: 5432
        database: taskdesk
        username: taskdesk_user
        password: ""
        # Use existing secret for external database credentials in the form of a uri, e.g.: "postgresql://user:pass@host:port/db"
        existingSecret:
          enabled: false
          name: ""
          passwordKey: postgres_uri
  # Additional environment variables for the taskdesk container.
  # Each entry is a standard Kubernetes EnvVar (supports `value` or `valueFrom`).
  # Useful for CUSTOM_OAUTH_*, SMTP_*, etc. without editing the chart.
  # extraEnv entries are appended after chart-defined vars; duplicate names override.
  extraEnv: []
  # extraEnv:
  #   - name: CUSTOM_OAUTH_DISCOVERY_URL
  #     value: "https://idp.example.com/.well-known/openid-configuration"
  #   - name: CUSTOM_OAUTH_CLIENT_ID
  #     valueFrom:
  #       secretKeyRef:
  #         name: oauth-secret
  #         key: client-id
  extraEnvFrom: []
  # extraEnvFrom:
  #   - secretRef:
  #       name: oauth-secret
  # Liveness touches no dependency, so a Postgres blip never restarts a healthy
  # pod and turn a brief outage into a long one. Readiness is where the
  # database check belongs. docs/05-operations/deployment.md § Health and readiness
  livenessProbe:
    httpGet:
      path: /api/public/health/live
      port: taskdesk
    initialDelaySeconds: 60
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /api/public/health/ready
      port: taskdesk
    initialDelaySeconds: 30
    periodSeconds: 10
# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: taskdesk.local
      paths:
        - path: /
          pathType: Prefix
          service: taskdesk
          port: 5173
  tls: []

# Gateway API configuration
gateway:
  enabled: false
  annotations: {}
  labels: {}
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - service: taskdesk
          port: 5173
