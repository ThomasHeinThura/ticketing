# The fast stage of the pull-request pipeline.
#
# docs/04-engineering/ci-cd.md is the single list of CI checks and this workflow implements
# its "Fast — required on every push, target under 15 minutes" block. Nothing is added that
# the document does not declare: scripts/ci/test-all.mjs reconciles the two on every run,
# and the `gates-declared` job below fails if they drift apart.
#
# Gates that cannot exist yet — check:tokens, check:ui, check:deps, check:queries,
# check:inventory, test:coverage, test:mcp, check:bundle-purity, check:bundle-size — have
# no job here on purpose. `pnpm test:all --list` prints each one with the reason and the
# issue that unblocks it. A job that passed because it found nothing to check would look
# like coverage and be worth less than nothing.
#
# Workflow hardening (ci-cd.md § Secrets): permissions are read-only at the top, no job
# here signs or publishes anything, and every third-party action is pinned by commit SHA.

name: CI - fast

on:
  pull_request:
    # `edited` matters: the PR-template and security-review checks read the body.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  # ── The Throttle 1 boundary ────────────────────────────────────────────────────────────
  # Its own job so it can be its own required status check on the protect-main ruleset,
  # independent of everything else in this workflow. docs/07-planning/status.md § Throttle 1
  # conditions 4 and 5: route coverage runs in CI, and a route without a policy fails the
  # build. The wrapper fails closed until the suite from #7 exists.
  route-policy:
    name: route policy coverage + permission matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history, because the shrink-only ratchet on
          # tests/permissions/inherited-uncovered.json compares that file against its
          # state at the MERGE BASE with main. The default shallow clone has no merge
          # base, so the ratchet could not run — and the failure would arrive looking
          # like a policy failure rather than a checkout problem. The step below exists
          # to keep those two apart.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: merge base is resolvable
        # Fails with its OWN message, before the suite runs. A gate that cannot read its
        # own baseline must say so in those words: "the ratchet did not run" and "the
        # ratchet ran and rejected your change" are different facts, and conflating them
        # is how someone concludes the gate is flaky and stops reading it.
        run: |
          git fetch --no-tags --depth=0 origin main 2>/dev/null || git fetch --no-tags origin main
          if ! base=$(git merge-base HEAD origin/main 2>/dev/null); then
            echo "::error::Could not resolve a merge base with origin/main. This is a"
            echo "::error::CHECKOUT problem, not a policy failure: the baseline ratchet"
            echo "::error::compares inherited-uncovered.json against its state there and"
            echo "::error::cannot run without it. Check fetch-depth on this job."
            exit 1
          fi
          echo "merge base with origin/main: $base"
      - name: pnpm test:permissions
        run: pnpm test:permissions

  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: pnpm lint (biome)
        # `pnpm lint` is `turbo lint`, and each package's lint script is
        # `biome check --write .`, which rewrites files. CI must report, not fix.
        run: pnpm lint:ci
      - name: pnpm typecheck
        run: pnpm typecheck
      - name: pnpm check:i18n
        run: pnpm check:i18n

  registers:
    name: registers - env, vocabulary, reviews, skips
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # check:reviews diffs against the base branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: pnpm check:env
        run: pnpm check:env
      - name: pnpm check:vocabulary
        run: pnpm check:vocabulary
      - name: pnpm check:reviews
        run: pnpm check:reviews
      - name: pnpm check:skips
        run: pnpm check:skips

  pull-request:
    name: pull request template + security review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: pr-template check
        # Reads the body from the event payload, and the security-review path globs from
        # docs/04-engineering/ci-cd.md.
        run: pnpm check:pr-template
      - name: pr-body parser unit tests
        # Not a new gate — it makes the gate above trustworthy. `stripComments` was a
        # CodeQL HIGH (js/incomplete-multi-character-sanitization): the regex it replaced
        # could reconstitute the very `<!--` it removed, so an author could hide a section
        # from a reviewer while this checker counted it as filled in. node:test, so no new
        # dependency.
        run: pnpm test:ci-scripts

  test:
    name: unit + component
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: pnpm test
        run: pnpm test

  contract:
    name: contract - OpenAPI drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: pnpm check:openapi
        # Regenerates the document and fails when tests/api-contract/openapi.json no longer
        # matches the API. Redocly lint and `oasdiff breaking` are the other half of
        # `pnpm test:contract` and need two dev dependencies that are not installed yet.
        run: pnpm check:openapi

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: pnpm build
        run: pnpm build

  # Deliberately two jobs, not one. As a single "supply chain" job the first failing step
  # stopped the second, so a red dependency audit hid whether the repository had a secret in
  # it — the more urgent of the two questions, and the one with a bounded fix. Split, each
  # answers its own question and neither masks the other.

  dependency-audit:
    name: supply chain - dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: pnpm audit
        # ci-cd.md: high or critical fails. RED TODAY, and left red on purpose. The
        # inherited graph carries high advisories — js-yaml via @commitlint/cli, nanoid via
        # apps__web>postcss — every one in devDependencies or build tooling. Fixing them is
        # a pnpm-lock.yaml change, which this branch does not own.
        #
        # Not narrowed to --prod, not lowered to --audit-level=critical, not given
        # continue-on-error. Any of those would turn a true statement into a green tick.
        # The gate reports what is true; the lockfile change makes it green.
        run: pnpm audit --audit-level=high

  secret-scan:
    name: supply chain - secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # gitleaks scans history, so it needs all of it.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: helm lint
        # helm ships on the GitHub-hosted Ubuntu runner image, so no action is needed.
        run: helm lint charts/taskdesk
      - name: helm template
        # The chart fails closed on every required bootstrap value (#20, now on main), so a
        # bare `helm template` cannot render and this step was red for the right reason.
        # Supply a synthetic fixture instead of weakening the chart.
        #
        # The two URLs must be DIFFERENT hostnames: validations.yaml rejects
        # clientUrl == portalUrl, because a shared cookie scope is what would let a portal
        # session reach the agent application (ADR 0004). Passing the same value twice here
        # would render fine and quietly stop testing that rule.
        #
        # The secrets are throwaway 64-character strings that exist only inside this step.
        # They are not credentials: nothing they could unlock is created.
        run: |
          helm template taskdesk charts/taskdesk \
            --set taskdesk.env.authSecret="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" \
            --set taskdesk.env.encryptionKey="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" \
            --set taskdesk.env.clientUrl=https://agent.ci.invalid \
            --set taskdesk.env.portalUrl=https://portal.ci.invalid \
            > /dev/null
      - name: helm template must FAIL without its secrets
        # helm lint exits 0 even when a `fail` directive fires, so without this the
        # fail-closed behaviour the chart exists for is never actually exercised in CI.
        run: |
          if helm template taskdesk charts/taskdesk > /dev/null 2>&1; then
            echo "::error::chart rendered with no authSecret — it must fail closed"
            exit 1
          fi
          echo "chart correctly refused to render without its bootstrap secrets"

  gates-declared:
    name: CI matches ci-cd.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: reconcile the gate list
        # Fails when ci-cd.md declares a gate CI does not run, or CI runs one ci-cd.md does
        # not declare. ci-cd.md is the single list; this keeps it true.
        run: pnpm test:all --list
