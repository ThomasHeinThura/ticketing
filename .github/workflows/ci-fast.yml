# The fast stage of the pull-request pipeline.
#
# docs/04-engineering/ci-cd.md is the single list of CI checks and this workflow implements
# its "Fast — required on every push, target under 15 minutes" block. Nothing is added that
# the document does not declare: scripts/ci/test-all.mjs reconciles the two on every run,
# and the `gates-declared` job below fails if they drift apart.
#
# Gates that cannot exist yet — check:tokens, check:ui, check:deps, check:queries,
# check:inventory, test:coverage, test:mcp, check:bundle-purity, check:bundle-size — have
# no job here on purpose. `pnpm test:all --list` prints each one with the reason and the
# issue that unblocks it. A job that passed because it found nothing to check would look
# like coverage and be worth less than nothing.
#
# Workflow hardening (ci-cd.md § Secrets): permissions are read-only at the top, no job
# here signs or publishes anything, and every third-party action is pinned by commit SHA.

name: CI - fast

on:
  pull_request:
    # `edited` matters: the PR-template and security-review checks read the body.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

# NO `merge_group:` trigger, deliberately (F5). `## Needs Thomas` asks for the fast jobs
# to become required status checks. The `pull-request` job below is conditional on
# `github.event_name == 'pull_request'`, so in a merge-queue run it does not exist — and a
# required check that never appears leaves the queue nothing to wait on. Rather than make
# the job report a neutral success in a context where it genuinely cannot read a pull-request
# body, the trigger is removed until every intended required check has meaningful
# merge-group semantics. Add it back with that proof, not before.

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  # ── The Throttle 1 boundary ────────────────────────────────────────────────────────────
  # Its own job so it can be its own required status check on the protect-main ruleset,
  # independent of everything else in this workflow. docs/07-planning/status.md § Throttle 1
  # conditions 4 and 5: route coverage runs in CI, and a route without a policy fails the
  # build. The wrapper fails closed until the suite from #7 exists.
  route-policy:
    name: route policy coverage + permission matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history, because the shrink-only ratchet on
          # tests/permissions/inherited-uncovered.json compares that file against its
          # state at the MERGE BASE with main. The default shallow clone has no merge
          # base, so the ratchet could not run — and the failure would arrive looking
          # like a policy failure rather than a checkout problem. The step below exists
          # to keep those two apart.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: merge base is resolvable
        # Fails with its OWN message, before the suite runs. A gate that cannot read its
        # own baseline must say so in those words: "the ratchet did not run" and "the
        # ratchet ran and rejected your change" are different facts, and conflating them
        # is how someone concludes the gate is flaky and stops reading it.
        run: |
          git fetch --no-tags --depth=0 origin main 2>/dev/null || git fetch --no-tags origin main
          if ! base=$(git merge-base HEAD origin/main 2>/dev/null); then
            echo "::error::Could not resolve a merge base with origin/main. This is a"
            echo "::error::CHECKOUT problem, not a policy failure: the baseline ratchet"
            echo "::error::compares inherited-uncovered.json against its state there and"
            echo "::error::cannot run without it. Check fetch-depth on this job."
            exit 1
          fi
          echo "merge base with origin/main: $base"
      - name: git identity for the ratchet's scratch repositories
        # `tests/permissions/git-baseline.test.ts` proves the shrink-only ratchet
        # against REAL git, by initialising throwaway repositories and committing
        # into them. A GitHub runner has no committer identity, so `git commit`
        # exits with `fatal: empty ident name` and the whole route-policy job goes
        # red -- reading exactly like a policy failure when it is nothing of the
        # kind. This job already separates "the ratchet could not run" from "the
        # ratchet rejected your change"; this is the same distinction one layer
        # down. Local runs pass because developers have a global identity set.
        run: |
          git config --global user.email "ci@taskdesk.invalid"
          git config --global user.name "TaskDesk CI"
      - name: pnpm check:route-policy
        # #19's fail-closed wrapper. It does not scan routes -- it locates #7's
        # published suite, refuses to pass without both route-coverage.test.ts and
        # matrix.test.ts, and then runs it. `pnpm test:permissions` remains #21's
        # canonical entry point and this delegates to it.
        run: pnpm check:route-policy

  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: pnpm lint (biome)
        # `pnpm lint` is `turbo lint`, and each package's lint script is
        # `biome check --write .`, which rewrites files. CI must report, not fix.
        run: pnpm lint:ci
      - name: pnpm typecheck
        run: pnpm typecheck
      - name: pnpm check:i18n
        run: pnpm check:i18n

  registers:
    # DO NOT RENAME THIS JOB. The `protect-main` ruleset binds its required status checks
    # to a job's DISPLAY NAME, as an exact string: "registers - env, vocabulary, reviews,
    # skips, overrides". Renaming the job does not add a check under the new name — it
    # silently removes the required one, because the name the ruleset waits for stops
    # being reported. A pull request then cannot merge, and worse, a ruleset edited to
    # chase the new name would have dropped a required gate from `main` in between.
    # `check:events` is added as a STEP below instead: the gate runs, the required check
    # keeps reporting, and no ruleset change is needed. Changing this string is Thomas's
    # call and needs the ruleset updated in the same breath.
    name: registers - env, vocabulary, reviews, skips, overrides
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # check:reviews diffs against the base branch.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: pnpm check:env
        run: pnpm check:env
      - name: pnpm check:vocabulary
        run: pnpm check:vocabulary
      - name: pnpm check:events
        # #86's mechanical published-vs-declared reconciliation for event keys — see
        # scripts/ci/check-events.mjs. Declared as its OWN row in ci-cd.md and its own
        # enabled entry in test-all.mjs's manifest — not an alias of `pnpm check:vocabulary`.
        # An earlier version aliased it, and the alias made this step deletable (or
        # `continue-on-error`/`if: false`-able) with `pnpm test:all` staying green, and let
        # `check:vocabulary`'s own step be removed the same way. Both gates are protected on
        # their own terms now; see scripts/ci/probes/workflow-alias-table.test.mjs.
        run: pnpm check:events
      - name: pnpm check:reviews
        run: pnpm check:reviews
      - name: pnpm check:skips
        run: pnpm check:skips
      - name: pnpm check:overrides
        run: pnpm check:overrides

  pull-request:
    name: pull request template + security review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: pr-template check
        # Reads the body from the event payload, and the security-review path globs from
        # docs/04-engineering/ci-cd.md.
        run: pnpm check:pr-template

  ci-scripts:
    name: gate checkers + red probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The probes construct their own throwaway repositories, but the suite also
          # asserts against THIS repository's real history (the union security scope and
          # the review-note binding both resolve a merge base), so the full history is
          # required here as well.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: pnpm test:ci-scripts
        # Declared in docs/04-engineering/ci-cd.md's fast stage, so it runs on every push
        # and not only on a pull request. Two things live here:
        #
        #   the checkers' own unit tests — `stripComments` was a CodeQL HIGH
        #   (js/incomplete-multi-character-sanitization): the regex it replaced could
        #   reconstitute the very `<!--` it removed, so an author could hide a section
        #   from a reviewer while the checker counted it as filled in;
        #
        #   the adversarial RED PROBES under scripts/ci/probes/ — each builds a
        #   throwaway git repository in which a known bypass is constructed on purpose
        #   (a diff that narrows the security-review list, a review note left behind by
        #   later code, a baseline bumped alongside the read it excuses, a waiver backed
        #   by a sentence that says the gate is NOT waived) and asserts the real checker
        #   exits non-zero. Each also asserts the OLD predicate would have passed, so a
        #   probe cannot go quietly vacuous.
        #
        # node:test and git, so no new dependency. Each probe repository sets its own
        # user.name/user.email, so no ambient git identity is needed.
        run: pnpm test:ci-scripts

  test:
    name: unit + component
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: pnpm test
        run: pnpm test

  contract:
    name: contract - OpenAPI drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: pnpm check:openapi
        # Regenerates the document and fails when tests/api-contract/openapi.json no longer
        # matches the API. Redocly lint and `oasdiff breaking` are the other half of
        # `pnpm test:contract` and need two dev dependencies that are not installed yet.
        run: pnpm check:openapi

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: pnpm build
        run: pnpm build

  # Deliberately two jobs, not one. As a single "supply chain" job the first failing step
  # stopped the second, so a red dependency audit hid whether the repository had a secret in
  # it — the more urgent of the two questions, and the one with a bounded fix. Split, each
  # answers its own question and neither masks the other.

  dependency-audit:
    name: supply chain - dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: pnpm audit
        # ci-cd.md: high or critical fails. GREEN — and green by fixing the graph, not by
        # narrowing the question. The inherited advisories this comment used to call
        # permanent (js-yaml via @commitlint/cli, nanoid via apps__web>postcss) are closed
        # by the pins in pnpm-workspace.yaml, which this branch DOES own. `pnpm audit`
        # reports no known vulnerabilities at EVERY severity, not only at high.
        #
        # Nothing is suppressed to get there: no --prod narrowing, no
        # --audit-level=critical, no continue-on-error, no .pnpmfile.cjs, no
        # auditConfig/ignoreGhsas anywhere in the repository.
        #
        # `.npmrc` DOES exist at the repository root and is 0 bytes — inherited, empty,
        # and therefore suppressing nothing. An earlier version of this comment claimed
        # there was "no .npmrc", which was false: the file is there. What IS true is that
        # it configures nothing, and that `.npmrc` sits in ci-cd.md's security-review
        # globs, so giving it content requires an independent review. Claiming absence
        # was both wrong and weaker than the real position.
        #
        # Any of those would turn a
        # true statement into a green tick, which is the opposite of the point.
        #
        # Read pnpm-workspace.yaml for what is pinned and why. Note what this gate CANNOT
        # see: removing a version FLOOR is invisible to it, because a floor sits exactly
        # where there is no advisory. `check:overrides` in the registers job guards the
        # override source itself for that reason.
        run: pnpm audit --audit-level=high

  secret-scan:
    name: supply chain - secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # gitleaks scans history, so it needs all of it.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: helm lint
        # helm ships on the GitHub-hosted Ubuntu runner image, so no action is needed.
        run: helm lint charts/taskdesk
      - name: helm template
        # The chart fails closed on every required bootstrap value (#20, now on main), so a
        # bare `helm template` cannot render and this step was red for the right reason.
        # Supply a synthetic fixture instead of weakening the chart.
        #
        # The two URLs must be DIFFERENT hostnames: validations.yaml rejects
        # clientUrl == portalUrl, because a shared cookie scope is what would let a portal
        # session reach the agent application (ADR 0004). Passing the same value twice here
        # would render fine and quietly stop testing that rule.
        #
        # The secrets are throwaway 64-character strings that exist only inside this step.
        # They are not credentials: nothing they could unlock is created.
        run: |
          helm template taskdesk charts/taskdesk \
            --set taskdesk.env.authSecret="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" \
            --set taskdesk.env.encryptionKey="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" \
            --set taskdesk.env.clientUrl=https://agent.ci.invalid \
            --set taskdesk.env.portalUrl=https://portal.ci.invalid \
            > /dev/null
      - name: helm template must FAIL without its secrets
        # helm lint exits 0 even when a `fail` directive fires, so without this the
        # fail-closed behaviour the chart exists for is never actually exercised in CI.
        run: |
          if helm template taskdesk charts/taskdesk > /dev/null 2>&1; then
            echo "::error::chart rendered with no authSecret — it must fail closed"
            exit 1
          fi
          echo "chart correctly refused to render without its bootstrap secrets"

  gates-declared:
    name: CI matches ci-cd.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: reconcile the gate list
        # Fails when ci-cd.md declares a gate CI does not run, or CI runs one ci-cd.md does
        # not declare. ci-cd.md is the single list; this keeps it true.
        run: pnpm test:all --list
