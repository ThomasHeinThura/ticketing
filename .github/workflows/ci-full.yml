  integration:
    name: integration - Postgres 18
    needs: [integration-1, integration-2, integration-3, integration-4, integration-5, integration-6, integration-7, integration-8]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Require every integration job to succeed
        run: node scripts/ci/assert-integration-shards.mjs
        env:
          GATE_LABEL: integration
          GATE_EXPECTED_JOBS: integration-1,integration-2,integration-3,integration-4,integration-5,integration-6,integration-7,integration-8
          GATE_JOB_RESULTS: ${{ toJSON(needs) }}

  e2e-1:
    name: e2e smoke shard 1/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The change-scope step reads landed commits from the merge base.
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Build the web app and workspace dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm build
        env:
          VITE_API_URL: ""
      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: sudo -- "$(command -v node)" scripts/ci/normalize-ubuntu-apt-mirror.mjs
      - name: Install Chromium
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser smoke shard 1/4
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm test:e2e --shard=1/4 '^(?!.*[-]persisted[.]spec[.]ts)'
      - name: Upload browser evidence
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-smoke-1
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

