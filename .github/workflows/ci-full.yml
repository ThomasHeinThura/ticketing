# The full stage of the pull-request pipeline.
#
# docs/04-engineering/ci-cd.md: "Full — required before merge, runs on the merge queue (or
# on the `ready-for-review` label), target under 45 minutes, sharded four ways."
#
# Most of this block cannot run yet. There is no Playwright suite, no deployable
# application to point one at (#11), no packages/ui (#9), and the visual-regression tool for
# G8 is still an open decision in docs/07-planning/status.md. Those jobs are written out
# below and disabled with `if: false`, so the shape is reviewable and the reason is next to
# it — but they are **not** to be added to the protect-main ruleset as required checks. A
# skipped job is not a passing gate, and treating it as one is how a suite goes green over
# nothing.

name: CI - full

on:
  merge_group:
  pull_request:
    types: [labeled, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  integration:
    name: integration - Postgres 18
    # RUNS ON EVERY PULL REQUEST. No label gate (F5).
    #
    # This job used to be conditional on the `ready-for-review` label. GitHub treats a
    # SKIPPED required check as satisfied, so making it required — which `## Needs Thomas`
    # asks for — produced a green required gate on precisely the pull requests where it
    # never ran. That is the trap this file's own header warns about: "a skipped job is not
    # a passing gate, and treating it as one is how a suite goes green over nothing."
    #
    # It costs one Testcontainers-managed Postgres container and ~90s. If a future expensive
    # matrix needs label-gating, gate THAT matrix and leave this job unconditional.
    #
    # ci-cd.md and testing-strategy.md say Testcontainers, and now this job actually does:
    # tests/api-integration/global-setup.ts starts a Postgres 18 Testcontainer and points
    # TASKDESK_DATABASE_URL at it when CI=true (issue #10). No `services:` block and no
    # fixed 5432 port mapping are needed -- Testcontainers picks an ephemeral host port
    # itself and manages the container's full lifecycle from inside the test run.
    #
    # No extra runner permissions are needed for this. ubuntu-latest GitHub-hosted runners
    # ship Docker Engine with the invoking user already in the `docker` group, so the
    # Testcontainers Node client talks to /var/run/docker.sock the same way it would on a
    # developer machine -- no `--privileged`, no Docker-in-Docker, no additional `permissions:`
    # block. (Verified against Testcontainers' own CI documentation, not guessed; unverified
    # by an actual GitHub Actions run from this change -- see the PR for that confirmation.)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: pnpm test:integration
        run: pnpm test:integration

  e2e:
    name: NOT ENABLED - e2e (agent + portal)
    if: false
    # Blocked by: no Playwright suite, and no deployable application to run it against
    # (#11). ci-cd.md also lists the security, reduced-motion (G9) and mobile-320 (H6)
    # projects; they arrive with the suite, as `pnpm test:e2e --project=…`.
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  a11y:
    name: NOT ENABLED - a11y (G4, axe)
    if: false
    # Blocked by: no Playwright suite and no screens to run axe against.
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  visual:
    name: NOT ENABLED - visual regression (G8)
    if: false
    # Blocked by: no Playwright suite, and the tool is undecided — Playwright
    # toHaveScreenshot with in-repo baselines, or Chromatic (docs/07-planning/status.md
    # § Open decisions).
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  performance:
    name: NOT ENABLED - performance budgets (G11)
    if: false
    # Blocked by: no Playwright suite, and no budgets written down anywhere.
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
