name: P0 hosted performance diagnostic probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initial-page-diagnostic:
    name: diagnostic probe - initial page and interactions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: Build the web app and workspace dependencies
        run: pnpm build
        env:
          VITE_API_URL: ""
      - name: Install Chromium
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture source-bound G11 diagnostic profiles
        run: pnpm --filter @taskdesk/web exec playwright test --config playwright.perf-diagnostic.config.ts
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p0-hosted-initial-page-diagnostic
          path: apps/web/test-results/g11-initial-page-diagnostic/initial-page-profile.json
          if-no-files-found: error
          retention-days: 7
