name: Diagnostic - hosted legacy board drag (manual, non-gating)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-board-drag-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  hosted-board-drag-diagnostic:
    name: diagnostic - hosted legacy board drag profile (non-required)
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/hosted-board-drag-diagnostic-20261015' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup

      - name: Build the web app and workspace dependencies
        run: pnpm build
        env:
          VITE_API_URL: ""

      - name: Bind source, fixture, and built manifest before measurement
        run: node apps/web/e2e/helpers/capture-hosted-drag-fullrunner-source.mjs

      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        run: sudo -- "$(command -v node)" scripts/ci/normalize-ubuntu-apt-mirror.mjs

      - name: Install Chromium
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium

      - name: Run the full performance suite with the canonical runner capture lifecycle
        id: fullrunner
        shell: bash
        run: |
          if pnpm --filter @taskdesk/web exec playwright test --config playwright.perf-fullrunner-diagnostic.config.ts; then
            playwright_exit_code=0
          else
            playwright_exit_code=$?
          fi
          printf 'exit_code=%s\n' "$playwright_exit_code" >> "$GITHUB_OUTPUT"

      - name: Write sanitized source-bound summary
        if: ${{ always() }}
        id: summary
        run: node apps/web/e2e/helpers/write-hosted-drag-fullrunner-summary.mjs '${{ steps.fullrunner.outputs.exit_code }}'

      - name: Preserve original fullrunner command result
        if: ${{ always() }}
        shell: bash
        run: |
          original_exit_code='${{ steps.fullrunner.outputs.exit_code }}'
          if [[ -z "$original_exit_code" ]]; then
            echo "The fullrunner command did not report an exit code."
            exit 1
          fi
          if [[ "$original_exit_code" != "0" ]]; then
            exit "$original_exit_code"
          fi
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const result = JSON.parse(readFileSync("apps/web/test-results/hosted-drag-fullrunner/hosted-board-drag-summary.json", "utf8")); if (result.status !== "complete" || result.commandExitCode !== 0) process.exit(1);'

      - name: Upload bounded numeric summary only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-board-drag-fullrunner-summary
          path: apps/web/test-results/hosted-drag-fullrunner/hosted-board-drag-summary.json
          if-no-files-found: warn
          retention-days: 7
