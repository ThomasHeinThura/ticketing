        with:
          name: playwright-persisted-2
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  e2e-7:
    name: e2e persisted shard 3/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The change-scope step reads landed commits from the merge base.
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Build the web app and workspace dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm build
        env:
          VITE_API_URL: ""
      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: sudo -- "$(command -v node)" scripts/ci/normalize-ubuntu-apt-mirror.mjs
      - name: Install Chromium
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser persisted shard 3/4
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm test:e2e --shard=3/4 '[-]persisted[.]spec[.]ts'
      - name: Upload browser evidence
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-persisted-3
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  e2e-8:
    name: e2e persisted shard 4/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The change-scope step reads landed commits from the merge base.
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Build the web app and workspace dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm build
        env:
          VITE_API_URL: ""
      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: sudo -- "$(command -v node)" scripts/ci/normalize-ubuntu-apt-mirror.mjs
      - name: Install Chromium
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser persisted shard 4/4
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm test:e2e --shard=4/4 '[-]persisted[.]spec[.]ts'
      - name: Upload browser evidence
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-persisted-4
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  e2e-image:
    name: e2e image - deploy helpers and shipping image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The change-scope step reads landed commits from the merge base.
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Normalize Ubuntu APT mirror for the deploy helper's apt downloads
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: sudo -- "$(command -v node)" scripts/ci/normalize-ubuntu-apt-mirror.mjs
      # always(): a deploy-helper failure must not hide the shipping-image verdict (each failing
      # step fails the job on its own, so this cannot turn a failure into a pass).
      - name: Verify the deploy helpers against a real Docker engine
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        run: scripts/ci/run-deploy-real-docker.sh
      - name: Build and boot the exact candidate shipping image
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: scripts/ci/run-shipping-image-smoke.sh --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload sanitized shipping-image proof
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shipping-image-proof
          path: ${{ runner.temp }}/taskdesk-image-proof-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e - protected-route redirect
    needs: [e2e-1, e2e-2, e2e-3, e2e-4, e2e-5, e2e-6, e2e-7, e2e-8, e2e-image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Require every e2e job to succeed
        run: node scripts/ci/assert-integration-shards.mjs
        env:
          GATE_LABEL: e2e
          GATE_EXPECTED_JOBS: e2e-1,e2e-2,e2e-3,e2e-4,e2e-5,e2e-6,e2e-7,e2e-8,e2e-image
