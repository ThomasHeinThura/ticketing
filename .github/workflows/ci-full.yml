name: Diagnostic - hosted legacy board drag (manual, non-gating)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-board-drag-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  hosted-board-drag-diagnostic:
    name: diagnostic - hosted legacy board drag profile (non-required)
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/hosted-board-drag-diagnostic-20261015' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup

      - name: Build the web app and workspace dependencies
        run: pnpm build
        env:
          VITE_API_URL: ""

      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        run: sudo -- "$(command -v node)" scripts/ci/normalize-ubuntu-apt-mirror.mjs

      - name: Install Chromium
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium

      - name: Capture hosted legacy board drag diagnostic
        run: pnpm --filter @taskdesk/web exec playwright test --config playwright.perf-diagnostic.config.ts --grep 'hosted manual diagnostic - legacy board drag CPU profile' --workers=1

      - name: Upload sanitized source-bound summary only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-board-drag-diagnostic-summary
          path: apps/web/test-results/g11-initial-page-diagnostic/**/hosted-board-drag-summary.json
          if-no-files-found: warn
          retention-days: 7
