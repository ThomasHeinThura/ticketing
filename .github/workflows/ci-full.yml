      - name: Upload browser evidence
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-persisted-1
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  e2e-6:
    name: e2e persisted shard 2/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The change-scope step reads landed commits from the merge base.
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Build the web app and workspace dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm build
        env:
          VITE_API_URL: ""
      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
