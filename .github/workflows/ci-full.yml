# The full stage of the pull-request pipeline.
#
# docs/04-engineering/ci-cd.md: Full runs on pull request opened/reopened/labeled/
# synchronize/ready_for_review events and on the merge queue, target under 45 minutes,
# sharded four ways.
#
# The E2E job runs the logged-out redirect smoke. G8 snapshots cover every exported UI
# Storybook story and deterministic fixtures for implemented inventory routes; future
# inventory routes activate their baseline when their route is introduced. G11 measures
# the seeded work-item list journeys and initial bundle.

name: CI - full

on:
  merge_group:
  pull_request:
    types: [opened, reopened, labeled, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  integration-1:
    name: integration shard 1/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Run integration shard 1/4
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm test:integration -- --shard=1/4

  integration-2:
    name: integration shard 2/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Run integration shard 2/4
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm test:integration -- --shard=2/4

  integration-3:
    name: integration shard 3/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Run integration shard 3/4
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm test:integration -- --shard=3/4

  integration-4:
    name: integration shard 4/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Run integration shard 4/4
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm test:integration -- --shard=4/4

  integration:
    name: integration - Postgres 18
    needs: [integration-1, integration-2, integration-3, integration-4]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Require every integration shard to succeed
        run: node scripts/ci/assert-integration-shards.mjs
        env:
          INTEGRATION_SHARD_RESULTS: ${{ toJSON(needs) }}

  e2e:
    name: e2e - protected-route redirect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The change-scope step reads landed commits from the merge base.
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Build the web app and workspace dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm build
        env:
          VITE_API_URL: ""
      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: sudo -- "$(command -v node)" scripts/ci/normalize-ubuntu-apt-mirror.mjs
      - name: Install Chromium
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser smoke
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm test:e2e
      # always(): a browser-smoke failure must not hide the deploy verdict (each failing step
      # fails the job on its own, so this cannot turn a failure into a pass).
      - name: Verify the deploy helpers against a real Docker engine
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        run: scripts/ci/run-deploy-real-docker.sh
      - name: Build and boot the exact candidate shipping image
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: scripts/ci/run-shipping-image-smoke.sh --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload sanitized shipping-image proof
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shipping-image-proof
          path: ${{ runner.temp }}/taskdesk-image-proof-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser evidence
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-smoke
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  a11y:
    name: a11y - accessibility (G4, axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The change-scope step reads landed commits from the merge base.
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Build the web app and workspace dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm build
        env:
          VITE_API_URL: ""
      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: sudo -- "$(command -v node)" scripts/ci/normalize-ubuntu-apt-mirror.mjs
      - name: Install Chromium
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Scan Storybook stories and browser screens
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm test:a11y
      - name: Upload accessibility browser evidence
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-a11y
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  visual:
    name: visual regression (G8)
    runs-on: ubuntu-latest
    # Screenshot baselines depend on browser and font rasterization. Pin the Playwright
    # browser and its Noble system fonts to the environment used to produce the checked-in
    # Linux snapshots; the default hosted runner produced consistent false pixel diffs.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The change-scope step reads landed commits from the merge base.
          fetch-depth: 0
      - name: Trust the checked-out repository inside the Playwright container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Build the web bundle and its transitive workspace dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm build --filter=@taskdesk/web... --force
      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: node scripts/ci/normalize-ubuntu-apt-mirror.mjs
      - name: Install Chromium
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Check inventory scope and run screen and Storybook baselines
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm test:visual
      # Diagnostic candidates never satisfy G8: the comparison above remains failed.
      # Keep them in the pinned raster environment for a human/source review.
      - name: Capture candidate screen baselines after failed validation
        if: ${{ failure() && steps.scope.outputs.full != 'false' }}
        run: pnpm --filter @taskdesk/web exec playwright test --config playwright.visual.config.ts --grep @visual --update-snapshots=all --output=candidate-visual-results
      - name: Upload unapproved screen baseline candidates
        if: ${{ always() && failure() && steps.scope.outputs.full != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unapproved-screen-baselines
          path: apps/web/e2e/visual.spec.ts-snapshots/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload visual diffs
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-visual
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  performance:
    name: performance - budgets (G11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The change-scope step reads landed commits from the merge base.
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Build the web app and workspace dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm build
        env:
          VITE_API_URL: ""
      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: sudo -- "$(command -v node)" scripts/ci/normalize-ubuntu-apt-mirror.mjs
      - name: Install Chromium
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Measure G11 performance budgets
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm test:perf
      - name: Upload performance browser evidence
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-performance
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Capture source-bound initial-page diagnostic (non-gating)
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        continue-on-error: true
        run: pnpm --filter @taskdesk/web exec playwright test --config playwright.perf-diagnostic.config.ts
      - name: Upload initial-page diagnostic
        if: ${{ always() && steps.scope.outputs.full != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g11-initial-page-diagnostic
          path: |
            apps/web/test-results/g11-initial-page-diagnostic/initial-page-profile.json
            apps/web/test-results/g11-initial-page-diagnostic/command-palette-profile.json
          if-no-files-found: warn
          retention-days: 7
