# The full stage of the pull-request pipeline.
#
# docs/04-engineering/ci-cd.md: Full runs on pull request opened/reopened/labeled/
# synchronize/ready_for_review events and on the merge queue, target under 45 minutes,
# sharded four ways.
#
# The E2E job runs the logged-out redirect smoke. G8 snapshots cover every exported UI
# Storybook story and deterministic fixtures for implemented inventory routes; future
# inventory routes activate their baseline when their route is introduced. G11 measures
# the seeded work-item list journeys and initial bundle.

name: CI - full

on:
  merge_group:
  pull_request:
    types: [opened, reopened, labeled, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  integration:
    name: integration - Postgres 18
    # RUNS ON EVERY PULL REQUEST. No label gate (F5).
    #
    # This job used to be conditional on the `ready-for-review` label. GitHub treats a
    # SKIPPED required check as satisfied, so making it required — which `## Needs Thomas`
    # asks for — produced a green required gate on precisely the pull requests where it
    # never ran. That is the trap this file's own header warns about: "a skipped job is not
    # a passing gate, and treating it as one is how a suite goes green over nothing."
    #
    # It costs one Testcontainers-managed Postgres container and ~90s. If a future expensive
    # matrix needs label-gating, gate THAT matrix and leave this job unconditional.
    #
    # ci-cd.md and testing-strategy.md say Testcontainers, and now this job actually does:
    # tests/api-integration/global-setup.ts starts a Postgres 18 Testcontainer and points
    # TASKDESK_DATABASE_URL at it when CI=true (issue #10). No `services:` block and no
    # fixed 5432 port mapping are needed -- Testcontainers picks an ephemeral host port
    # itself and manages the container's full lifecycle from inside the test run.
    #
    # No extra runner permissions are needed for this. ubuntu-latest GitHub-hosted runners
    # ship Docker Engine with the invoking user already in the `docker` group, so the
    # Testcontainers Node client talks to /var/run/docker.sock the same way it would on a
    # developer machine -- no `--privileged`, no Docker-in-Docker, no additional `permissions:`
    # block. (Verified against Testcontainers' own CI documentation, not guessed; unverified
    # by an actual GitHub Actions run from this change -- see the PR for that confirmation.)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: pnpm test:integration
        run: pnpm test:integration

  e2e:
    name: e2e - protected-route redirect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: Build the web app and workspace dependencies
        run: pnpm build
        env:
          VITE_API_URL: ""
      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        run: sudo -- "$(command -v node)" scripts/ci/normalize-ubuntu-apt-mirror.mjs
      - name: Install Chromium
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser smoke
        run: pnpm test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-smoke
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  a11y:
    name: a11y - accessibility (G4, axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: Build the web app and workspace dependencies
        run: pnpm build
        env:
          VITE_API_URL: ""
      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        run: sudo -- "$(command -v node)" scripts/ci/normalize-ubuntu-apt-mirror.mjs
      - name: Install Chromium
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Scan Storybook stories and browser screens
        run: pnpm test:a11y
      - name: Upload accessibility browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-a11y
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  visual:
    name: visual regression (G8)
    runs-on: ubuntu-latest
    # Screenshot baselines depend on browser and font rasterization. Pin the Playwright
    # browser and its Noble system fonts to the environment used to produce the checked-in
    # Linux snapshots; the default hosted runner produced consistent false pixel diffs.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Trust the checked-out repository inside the Playwright container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
      - name: Build the permissions package used by the web bundle
        run: pnpm --filter @taskdesk/permissions build
      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        run: sudo -- "$(command -v node)" scripts/ci/normalize-ubuntu-apt-mirror.mjs
      - name: Install Chromium
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Check inventory scope and run screen and Storybook baselines
        run: pnpm test:visual
      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-visual
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

  performance:
    name: performance - budgets (G11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - name: Build the web app and workspace dependencies
        run: pnpm build
        env:
          VITE_API_URL: ""
      - name: Normalize Ubuntu APT mirror for Chromium dependencies
        run: sudo -- "$(command -v node)" scripts/ci/normalize-ubuntu-apt-mirror.mjs
      - name: Install Chromium
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Measure G11 performance budgets
        run: pnpm test:perf
      - name: Upload performance browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-performance
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Capture source-bound initial-page diagnostic (non-gating)
        if: always()
        continue-on-error: true
        run: pnpm --filter @taskdesk/web exec playwright test --config playwright.perf-diagnostic.config.ts
      - name: Upload initial-page diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g11-initial-page-diagnostic
          path: apps/web/test-results/g11-initial-page-diagnostic/initial-page-profile.json
          if-no-files-found: warn
          retention-days: 7
