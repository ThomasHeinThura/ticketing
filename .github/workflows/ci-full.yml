# The full stage of the pull-request pipeline.
#
# docs/04-engineering/ci-cd.md: Full runs on pull request opened/reopened/labeled/
# synchronize/ready_for_review events and on the merge queue. Required checks target under
# 10 minutes and must finish within 20: integration runs in 8 shards and the browser e2e
# suite in 8 shards (4 over every spec except `*-persisted.spec.ts`, 4 over those, chosen by a
# file-path filter argument, no config change) plus a separate shipping-image job. Every shard is an explicit job (the
# workflow scanner refuses `needs` and `strategy` on a gate-bearing job) and a non-gate
# aggregator keeps the original required check name and fails closed unless every shard
# succeeded. Sharding removes, skips and weakens no gate, test or threshold.
#
# The E2E jobs run the whole browser suite, @a11y specs included, split by test. G8 snapshots
# cover every exported UI Storybook story and deterministic fixtures for implemented inventory
# routes; future inventory routes activate their baseline when their route is introduced. G11
# measures the seeded work-item list journeys and initial bundle.

name: CI - full

on:
  merge_group:
  pull_request:
    types: [opened, reopened, labeled, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  integration-1:
    name: integration shard 1/8
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Run integration shard 1/8
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm test:integration -- --shard=1/8

  integration-2:
    name: integration shard 2/8
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/change-scope
      - uses: ./.github/actions/setup
        if: ${{ steps.scope.outputs.full != 'false' }}
      - name: Run integration shard 2/8
        if: ${{ steps.scope.outputs.full != 'false' }}
        run: pnpm test:integration -- --shard=2/8

  integration-3:
    name: integration shard 3/8
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
