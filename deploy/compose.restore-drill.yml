# Scratch recovery only: no proxy discovery and no host ports.
# Use an explicit, non-default -p/--project-name and matching isolated restore mode.
services:
  taskdesk:
    labels:
      traefik.enable: "false"
    volumes: !override
      - taskdesk-data:${TASKDESK_DRILL_DATA_MOUNT:-/app/data}
networks:
  taskdesk:
    name: ${COMPOSE_PROJECT_NAME:?an explicit Compose project is required}-restore
    internal: true
