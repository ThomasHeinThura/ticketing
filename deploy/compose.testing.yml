# Isolated laptop testing. Supply private environment files through SIT_PRIVATE_DIR.
# Restore a copy before starting migrate/taskdesk; never point this at a live volume.
name: taskdesk-codex-testing

services:
  postgres:
    image: postgres:18-alpine
    env_file: ${SIT_PRIVATE_DIR:?Set SIT_PRIVATE_DIR}/postgres.env
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${SIT_DATABASE_PORT:-62873}:5432"
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${SIT_IMAGE:?Set SIT_IMAGE to the locally built source image}
    env_file: ${SIT_PRIVATE_DIR}/migrate.env
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=1770"]
    depends_on:
      postgres:
        condition: service_healthy

  taskdesk:
    image: ${SIT_IMAGE}
    env_file: ${SIT_PRIVATE_DIR}/app.env
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=1770"]
    volumes:
      - attachments:/app/data/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, /app/healthcheck.mjs]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12

  traefik:
    image: traefik:v3.6.7
    command:
      - --providers.file.filename=/config/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingtimeouts.idletimeout=180s
      - --accesslog=false
      - --log.level=ERROR
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${SIT_PRIVATE_DIR}/proxy:/config:ro
    ports:
      - "127.0.0.1:${SIT_HTTP_PORT:-80}:80"
      - "[::1]:${SIT_HTTP_PORT:-80}:80"
      - "127.0.0.1:${SIT_HTTPS_PORT:-443}:443"
      - "[::1]:${SIT_HTTPS_PORT:-443}:443"
    depends_on:
      taskdesk:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:18025:8025"
      - "127.0.0.1:11025:1025"

  valkey:
    image: valkey/valkey:9-alpine
    env_file: ${SIT_PRIVATE_DIR}/valkey.env
    command:
      - sh
      - -c
      - 'exec valkey-server --save "" --appendonly no --protected-mode yes --maxmemory 64mb --requirepass "$$REDISCLI_AUTH"'
    restart: unless-stopped
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  attachments:
  mailpit-data:
