# Overlay — local development.
#
#   docker compose -f compose.yml -f deploy/compose.local.yml -f deploy/compose.traefik.yml up -d --wait
#
# Use scripts/deploy.sh local, which also generates secrets and certificates,
# waits for health and probes the result. Bare `docker compose up` produces a
# stack that appears to be running and is not.
#
# NO FILE PUBLISHES THE APPLICATION PORT, this one included (#752). Traefik
# reaches 5173 over the `taskdesk` network and scripts/deploy.sh probes it from
# inside the container, so a host port adds nothing but a way around the proxy:
# with TASKDESK_TRUST_PROXY=1 below, anything that can reach a published 5173
# can forge X-Forwarded-For. Compose concatenates `ports:` across files, so a
# base file that published 5173 would publish it in production too.
# Production never loads this file. scripts/deploy.sh production asserts it.
#
# Every port a local overlay does publish is bound to loopback (127.0.0.1 and
# [::1]); see deploy/compose.traefik.yml and traefik-and-domains.md § Local
# development for reaching the stack from another machine.

services:
  taskdesk:
    environment:
      # Local Traefik is the only hop in front of the container, and it is on
      # the same Docker network. Directly verifiable here, unlike a real
      # deployment: see docs/05-operations/proxy-topology-evidence.md.
      TASKDESK_TRUST_PROXY: "1"
      # HTTP webhook targets are permitted in development only (WH-12).
      NODE_ENV: development
      TASKDESK_BOOTSTRAP_ADMIN_EMAIL: ${TASKDESK_BOOTSTRAP_ADMIN_EMAIL:-}
    labels:
      # Service/router names are prefixed `taskdesk-local` (not the bare
      # `taskdesk` reused across every overlay before this) because Traefik's
      # Docker provider discovers every `traefik.enable=true` container on the
      # Docker host it runs against — it is not scoped to one Compose project
      # or network. Two stacks on the same host that both defined a service
      # named `taskdesk` would merge into one Traefik service with both
      # containers as backends, load-balancing into an unreachable one.
      # docs/05-operations/traefik-and-domains.md § Environment-prefixed names
      - traefik.enable=true
      - traefik.docker.network=taskdesk
      - traefik.http.services.taskdesk-local.loadbalancer.server.port=${TASKDESK_PORT:-5173}
      - traefik.http.services.taskdesk-local.loadbalancer.healthcheck.path=/api/public/health/ready
      - traefik.http.routers.taskdesk-local-agent.rule=Host(`${TASKDESK_AGENT_HOST:-ticket.${DOMAIN:-localhost}}`)
      - traefik.http.routers.taskdesk-local-agent.entrypoints=websecure
      - traefik.http.routers.taskdesk-local-agent.tls=true
      - traefik.http.routers.taskdesk-local-agent.service=taskdesk-local
      - traefik.http.routers.taskdesk-local-agent.middlewares=security-headers@file,compress@file,rate-limit@file
      - traefik.http.routers.taskdesk-local-portal.rule=Host(`${TASKDESK_PORTAL_HOST:-portal.${DOMAIN:-localhost}}`)
      - traefik.http.routers.taskdesk-local-portal.entrypoints=websecure
      - traefik.http.routers.taskdesk-local-portal.tls=true
      - traefik.http.routers.taskdesk-local-portal.service=taskdesk-local
      - traefik.http.routers.taskdesk-local-portal.middlewares=security-headers@file,compress@file,rate-limit@file

  postgres:
    # Published so psql, a GUI client and the integration tests can reach it.
    # Local only.
    ports:
      - "127.0.0.1:5432:5432"

  # Local mail. Every notification the instance sends lands here instead of a
  # real inbox; SMTP host/port are configured in God Mode -> Notifications
  # (mailpit:1025), exactly as a real deployment would configure a real relay.
  mailpit:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit-data:/data
    networks:
      - taskdesk
    labels:
      - traefik.enable=true
      - traefik.docker.network=taskdesk
      - traefik.http.services.mailpit.loadbalancer.server.port=8025
      - traefik.http.routers.mailpit.rule=Host(`mail.${DOMAIN:-localhost}`)
      - traefik.http.routers.mailpit.entrypoints=websecure
      - traefik.http.routers.mailpit.tls=true
      - traefik.http.routers.mailpit.service=mailpit

  # Only started with `--profile s3`; the files host is local-only here.
  seaweedfs:
    labels:
      - traefik.enable=true
      - traefik.docker.network=taskdesk
      - traefik.http.services.taskdesk-local-files.loadbalancer.server.port=8333
      - traefik.http.routers.taskdesk-local-files.rule=Host(`${TASKDESK_FILES_HOST:-files.${DOMAIN:-localhost}}`)
      - traefik.http.routers.taskdesk-local-files.entrypoints=websecure
      - traefik.http.routers.taskdesk-local-files.tls=true
      - traefik.http.routers.taskdesk-local-files.service=taskdesk-local-files
      - traefik.http.routers.taskdesk-local-files.middlewares=files-headers@file

volumes:
  mailpit-data:
