# Overlay — SIT on proxy VM (technexus.info).
#
#   docker compose -f compose.yml -f deploy/compose.sit.yml up -d --wait
#
# Target host: proxy (4.194.153.78)
# Origins:
#   Agent:  https://tickting.technexus.info
#   Portal: https://portal.technexus.info
# Reverse proxy: host-managed Traefik on external network `web` with resolver `le`.
# Cloudflare stays enabled. A TaskDesk-only normalizer preserves its verified client IP.

services:
  taskdesk:
    environment:
      NODE_ENV: production
      TASKDESK_TRUST_PROXY: "1"
    labels:
      - traefik.enable=false
    networks:
      - taskdesk
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1536M }
        reservations: { cpus: "0.5", memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  sit-proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TASKDESK_PORT: ${TASKDESK_PORT:-5173}
      TASKDESK_SIT_TRAEFIK_HOST: ${TASKDESK_SIT_TRAEFIK_HOST:-maria-edge-traefik-1}
      NGINX_ENVSUBST_FILTER: ^(TASKDESK_PORT|TASKDESK_SIT_TRAEFIK_HOST)$
    volumes:
      - ./deploy/sit-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    depends_on:
      taskdesk:
        condition: service_healthy
    networks:
      - taskdesk
      - web
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.services.taskdesk-sit.loadbalancer.server.port=8080
      - traefik.http.services.taskdesk-sit.loadbalancer.healthcheck.path=/healthz
      # Source is the Traefik TCP peer; never use forwarded-header depth here.
      - traefik.http.middlewares.taskdesk-sit-cloudflare.ipallowlist.sourcerange=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      # agent (preserve tickting spelling)
      - traefik.http.routers.taskdesk-sit-agent.rule=Host(`tickting.technexus.info`)
      - traefik.http.routers.taskdesk-sit-agent.entrypoints=websecure
      - traefik.http.routers.taskdesk-sit-agent.tls=true
      - traefik.http.routers.taskdesk-sit-agent.tls.certresolver=le
      - traefik.http.routers.taskdesk-sit-agent.service=taskdesk-sit
      - traefik.http.routers.taskdesk-sit-agent.middlewares=taskdesk-sit-cloudflare
      # portal
      - traefik.http.routers.taskdesk-sit-portal.rule=Host(`portal.technexus.info`)
      - traefik.http.routers.taskdesk-sit-portal.entrypoints=websecure
      - traefik.http.routers.taskdesk-sit-portal.tls=true
      - traefik.http.routers.taskdesk-sit-portal.tls.certresolver=le
      - traefik.http.routers.taskdesk-sit-portal.service=taskdesk-sit
      - traefik.http.routers.taskdesk-sit-portal.middlewares=taskdesk-sit-cloudflare

  postgres:
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2048M }
        reservations: { cpus: "0.5", memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  valkey:
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
        reservations: { cpus: "0.1", memory: 64M }

networks:
  web:
    external: true
    name: web
