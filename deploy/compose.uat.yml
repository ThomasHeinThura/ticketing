# ===========================================================================
#  APPLIED AND LIVE. Issue #6 (inherited kaneo auth defaults — anonymous
#  sign-in among them) closed before this overlay was first brought up, and
#  is CLOSED as of this comment. `ticket-v2-uat.bimats.com` and
#  `portal-v2-uat.bimats.com` are both running this overlay in production
#  right now, on this host.
#
#  Nothing in scripts/deploy.sh loads this file — bringing it up (or updating
#  the running stack, e.g. `docker compose --env-file .env -f compose.yml
#  -f deploy/compose.uat.yml up -d --wait`) is still a deliberate manual act,
#  same as it always was; it is just no longer a BLOCKED one.
# ===========================================================================
#
# Overlay — UAT on the bimats.com host. As production, different hostnames, and
# one material difference in topology: TLS terminates at CloudFront, not at
# Traefik.
#
#   docker compose -f compose.yml -f deploy/compose.uat.yml up -d --wait
#
# UAT is held to the production standard: same image, same resource limits,
# backed up and monitored (docs/05-operations/environments.md).
#
# v1 UAT stays running and untouched. v2 deploys BESIDE it with its own Compose
# project, containers, network, volumes and database. Never reuse a v1 volume;
# never `docker compose down -v` against v1. v1's project is `taskdesk-uat`,
# serving ticket-uat.bimats.com and customerportal-uat.bimats.com.

# Its own project, so every container, volume and network is distinct from v1's.
name: taskdesk-v2-uat

services:
  taskdesk:
    environment:
      NODE_ENV: production
      # Issue #8's cutover needs ~7 days of clean shadow-mode evidence from a
      # real UAT deployment under real traffic (docs/05-operations/
      # configuration-reference.md). UAT is where that evidence is supposed to
      # come from, so it runs with shadow mode on by standing default, not as
      # a one-off manual override — every future UAT deploy starts the clock
      # without anyone having to remember to set this.
      TASKDESK_POLICY_SHADOW: "on"
      # ---------------------------------------------------------------
      # MEASURED, not assumed. 2026-09-06.
      #
      # The chain is CloudFront -> Traefik -> TaskDesk, and BOTH hops append to
      # X-Forwarded-For, so the real client is the second entry from the right:
      #
      #   viewer sends   (nothing, or a forged XFF)
      #   CloudFront     appends the viewer's IP
      #   Traefik        trusts the CloudFront edge (it is in the dokploy
      #                  Traefik's forwardedHeaders.trustedIPs) and appends the
      #                  edge IP
      #   TaskDesk sees  "<forged...>, <viewer>, <cloudfront-edge>"
      #
      # Full evidence, including the captured header values and how to reproduce
      # the measurement: docs/05-operations/proxy-topology-evidence.md.
      # ---------------------------------------------------------------
      TASKDESK_TRUST_PROXY: "2"
    labels:
      # Service/router/middleware names are prefixed `taskdesk-uat` (not the
      # bare `taskdesk` this overlay's service used before) because Traefik's
      # Docker provider discovers every `traefik.enable=true` container on the
      # Docker host it runs against — it is not scoped to one Compose project
      # or network. A stray `taskdesk` container from another stack on the
      # same host (this one included: v2 UAT and local dev have both run on
      # this box at once) would otherwise merge into this overlay's Traefik
      # service, load-balancing into a backend unreachable from that Traefik's
      # own network. docs/05-operations/traefik-and-domains.md § Environment-
      # prefixed names
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.taskdesk-uat.loadbalancer.server.port=${TASKDESK_PORT:-5173}
      - traefik.http.services.taskdesk-uat.loadbalancer.healthcheck.path=/api/public/health/ready
      # `web`, not `websecure`, and no certresolver: CloudFront terminates TLS
      # and reaches this Traefik over plain HTTP on :80. A `websecure` router
      # here would never be matched, and an ACME challenge would never be
      # answered, because port 443 on this host is not what the browser talks
      # to. Measured: entryPointName "web", RequestScheme "http", in the
      # Traefik access log for a real request to ticket-uat.bimats.com.
      - traefik.http.routers.taskdesk-uat-agent.rule=Host(`ticket-v2-uat.${DOMAIN:?DOMAIN is required}`)
      - traefik.http.routers.taskdesk-uat-agent.entrypoints=web
      - traefik.http.routers.taskdesk-uat-agent.service=taskdesk-uat
      - traefik.http.routers.taskdesk-uat-agent.middlewares=taskdesk-uat-headers@docker,taskdesk-uat-compress@docker,taskdesk-uat-ratelimit@docker
      - traefik.http.routers.taskdesk-uat-portal.rule=Host(`portal-v2-uat.${DOMAIN:?DOMAIN is required}`)
      - traefik.http.routers.taskdesk-uat-portal.entrypoints=web
      - traefik.http.routers.taskdesk-uat-portal.service=taskdesk-uat
      - traefik.http.routers.taskdesk-uat-portal.middlewares=taskdesk-uat-headers@docker,taskdesk-uat-compress@docker,taskdesk-uat-ratelimit@docker
      # `@docker`, not `@file`: this overlay attaches to the HOST'S EXISTING
      # Dokploy-managed Traefik (dokploy-network), which loads its own dynamic
      # file-provider config, not this repo's deploy/traefik/dynamic/middlewares.yml.
      # An `@file` reference here silently disables the router — Traefik reports
      # `error: middleware "X@file" does not exist` and `status: disabled` with
      # no router-level failure surfaced anywhere else. Verified live against
      # this host's actual Traefik on 2026-09-26. Defining the middlewares
      # inline as `@docker` labels (same values as middlewares.yml, kept in
      # sync by hand — there is no way to reference a file-provider middleware
      # from a container attached to someone else's Traefik) is what v1's own
      # taskdesk-uat stack already does, proven working on this exact host.
      - traefik.http.middlewares.taskdesk-uat-headers.headers.stsSeconds=63072000
      - traefik.http.middlewares.taskdesk-uat-headers.headers.stsIncludeSubdomains=false
      - traefik.http.middlewares.taskdesk-uat-headers.headers.stsPreload=false
      - traefik.http.middlewares.taskdesk-uat-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.taskdesk-uat-headers.headers.frameDeny=true
      - traefik.http.middlewares.taskdesk-uat-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.taskdesk-uat-headers.headers.permissionsPolicy=geolocation=(), camera=(), microphone=(), payment=()
      - traefik.http.middlewares.taskdesk-uat-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin
      - traefik.http.middlewares.taskdesk-uat-headers.headers.customResponseHeaders.X-Powered-By=
      - traefik.http.middlewares.taskdesk-uat-headers.headers.customResponseHeaders.Server=
      - traefik.http.middlewares.taskdesk-uat-compress.compress=true
      - traefik.http.middlewares.taskdesk-uat-ratelimit.ratelimit.average=100
      - traefik.http.middlewares.taskdesk-uat-ratelimit.ratelimit.burst=200
    networks:
      - taskdesk
      - dokploy-network
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1536M }
        reservations: { cpus: "0.5", memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  postgres:
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2048M }
        reservations: { cpus: "0.5", memory: 512M }

  valkey:
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
        reservations: { cpus: "0.1", memory: 64M }

networks:
  # Renamed so it cannot collide with another project's `taskdesk` network.
  taskdesk:
    name: taskdesk-v2-uat
  # The shared proxy network this host already runs. External: we attach, we do
  # not create it, and we never reconfigure it.
  dokploy-network:
    external: true
    name: dokploy-network

# NOT SET, and this is the open item on this topology:
#
#   The middlewares above cannot fix X-Forwarded-Proto. Traefik trusts the
#   CloudFront edge, so it passes a viewer-supplied X-Forwarded-Proto through
#   verbatim, and when none is supplied it sets `http` — because its own
#   entrypoint is plain :80. Either way the application does not learn that the
#   viewer used HTTPS. Whether CloudFront forwards a viewer-supplied
#   X-Forwarded-Proto depends on the distribution's origin request policy, which
#   is not readable from this host.
#
#   Resolve it at the CDN (an origin custom header `X-Forwarded-Proto: https`,
#   which CloudFront applies to every origin request) before this overlay is
#   used for anything that issues a secure cookie or an absolute URL.
#   docs/05-operations/proxy-topology-evidence.md
