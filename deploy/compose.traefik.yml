# Overlay — a local Traefik, with a self-signed certificate.
#
#   docker compose -f compose.yml -f deploy/compose.local.yml -f deploy/compose.traefik.yml up -d --wait
#
# Its purpose is that the production label configuration is exercised locally
# rather than being first tested in UAT. It is NOT loaded in production: this
# host, like v1's, already runs a Traefik serving other applications, and
# deploy/compose.prod.yml attaches to that existing proxy network and
# contributes only labels.
#
# scripts/deploy.sh local generates deploy/local/certs/{local.crt,local.key} and
# deploy/traefik/dynamic/tls-local.yml. Trust local.crt in the OS keychain to
# stop browser warnings.
#
# Host ports 80/443 are NOT hardcoded below. A machine that has never seen this
# repo is the target ("clean machine"), but plenty of real development hosts
# already run another reverse proxy (Dokploy, a second TaskDesk checkout, nginx)
# bound to 80/443 — and Compose fails the whole `up` if a published port is
# already taken. TASKDESK_LOCAL_HTTP_PORT / TASKDESK_LOCAL_HTTPS_PORT (default
# 80/443, unset on a genuinely clean machine) let that host override without
# touching this file. scripts/deploy.sh checks these ports are free before
# starting anything, and fails with the env vars to set rather than a bare
# Docker "address already in use". See docs/05-operations/traefik-and-domains.md
# § Local development.
#
# NOT PROVIDED, deliberately: an ACME/Let's Encrypt resolver for a standalone
# production host that has no proxy of its own. It needs a contact email, and
# there is no environment variable for one — configuration-reference.md's
# "Variables the application does not read" table lists DOMAIN,
# TASKDESK_IMAGE_TAG, TASKDESK_IMAGE_DIGEST and TASKDESK_HSTS_PRELOAD and
# nothing else. Adding one is a decision, not an implementation detail, so it is
# raised rather than invented. See docs/07-planning/status.md.
#
# Specification: docs/05-operations/traefik-and-domains.md

services:
  traefik:
    image: traefik:v3.6.7
    restart: unless-stopped
    command:
      - --global.sendanonymoususage=false
      - --api.dashboard=false
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=taskdesk
      - --providers.file.directory=/etc/traefik/dynamic
      # false, overriding Traefik's own default of true, deliberately:
      # `--providers.file.watch=true` needs an inotify instance, and inotify
      # instances are capped PER HOST UID, not per container. On a host
      # already running enough other root-owned containers, `true` made this
      # provider fail outright ("too many open files"), taking every @file
      # middleware — and every router that references one — down with it.
      # Consequence: `docker compose up -d` does not recreate a container
      # just because a bind-mounted file's content changed with no
      # service-definition change, so a `middlewares.yml`-only edit now
      # needs an explicit Traefik restart/recreate (or a scripts/deploy.sh
      # rerun) to take effect — it no longer picks it up live.
      # Verified live; see traefik-and-domains.md § Security headers.
      - --providers.file.watch=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Idle timeout above the application's 30-second WebSocket heartbeat, or
      # connections are culled mid-conversation.
      - --entrypoints.websecure.transport.respondingtimeouts.idletimeout=180s
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --log.level=INFO
    ports:
      - "${TASKDESK_LOCAL_HTTP_PORT:-80}:80"
      - "${TASKDESK_LOCAL_HTTPS_PORT:-443}:443"
    volumes:
      # Read-only socket: Traefik discovers routers from container labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./deploy/local/certs:/etc/traefik/certs:ro
    networks:
      - taskdesk
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
